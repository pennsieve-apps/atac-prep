services:
  processor:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    mem_limit: 2g
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - dev.env
    volumes:
      - ./data/fixture/linked:/data/input:ro
      - ./data/output:/data/output
      # the fixture's tiny genome in place of the baked GRCh38/GRCm39 annotations (its genes are synthetic)
      - ./data/fixture/genomes:/opt/genomes:ro
